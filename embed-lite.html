<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haunted Village</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Haunted Village: games, shorts, a song you compose, and a live Witch Tracker for Halloween night.">
<meta name="theme-color" content="#140B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haunted Village">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{color-scheme:dark;touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;touch-action:manipulation}button,a,[role=button]{touch-action:manipulation}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one tall illustrated village drawn on a fixed canvas; the page scrolls a camera through it. Buildings are buttons placed over the drawing. Single dark look by design. */
:root{
  --bg:#140B2E; --ink:#FFF4E6; --muted:#D9CCF3; --pumpkin:#FF7A1A; --candle:#FFC34D; --slime:#8EE65B; --violet:#8A5CF5;
  --card:#22134A; --card-2:#2E1B60; --line:rgba(255,244,230,.1); --shadow:0 16px 40px rgba(0,0,0,.45); --r:22px;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --display:'Creepster','Impact','Arial Black',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#0B0520}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* world */
#world{position:fixed;inset:0;display:block;touch-action:pan-y}
#spacer{position:relative;pointer-events:none}
#hots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hot{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;transform-origin:50% 100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hot .sign{display:flex;flex-direction:row;align-items:center;gap:9px;background:#140B2E;border:2px solid var(--slime);border-radius:999px;padding:5px 14px 6px;color:var(--ink);font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.5);transition:transform .2s;transform:translateY(0)}
.hot .sign .ic{font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}.hot .sign .tx{display:flex;flex-direction:column;align-items:flex-start}
.hot .sign small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--slime)}
.hot:hover .sign,.hot:focus-visible .sign{transform:translateY(-6px) scale(1.06)}
.hot.locked .sign{border-color:#5B4A86}.hot.locked .sign small{color:#C8B8EA}
.hot.new .sign{border-color:var(--candle)}.hot.new .sign small{color:var(--candle)}
.hot.tracker .sign{border-color:var(--pumpkin);font-size:16px;padding:8px 20px}.hot.tracker .sign small{color:var(--pumpkin)}
.ghostbtn{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;width:36px;height:40px;opacity:.85;transition:transform .2s}
.ghostbtn:hover{transform:scale(1.2)}
.ghostbtn.found{opacity:.95}
.ghostbtn svg{width:100%;height:100%;display:block;animation:hvFloat 3.6s ease-in-out infinite}
@keyframes hvFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes hvPop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ghostbtn.found svg{animation:hvPop .45s ease-out}

/* top bar */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;padding-block:10px;pointer-events:none}
.top>*{pointer-events:auto}
.rbtn{width:46px;height:46px;border-radius:50%;border:0;background:#E2453F;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.4);flex:none;transition:transform .15s}
.rbtn:hover{transform:scale(1.08)}
.rbtn.off{background:#5B4A86}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(14,7,38,.82);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill.ok{color:var(--slime)}
.count{margin-left:auto;display:flex;gap:4px;font-variant-numeric:tabular-nums}
.count div{background:#E2453F;color:#fff;border-radius:10px;padding:5px 8px 3px;min-width:56px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.count b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.count span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.count.flight div{background:#4E8A2A}
@media (max-width:640px){.count div{min-width:46px;padding:4px 6px 2px}.count b{font-size:20px}.pill.gh{display:none}}

#flash{position:fixed;inset:0;background:#EAF0FF;opacity:0;pointer-events:none;z-index:34}
#flash.go{animation:flashgo 1s ease-out}
@keyframes flashgo{0%{opacity:0}5%{opacity:.5}12%{opacity:.04}20%{opacity:.34}100%{opacity:0}}
.thr{position:relative;border-radius:22px;overflow:hidden;min-height:560px;padding:0 0 70px;background:radial-gradient(ellipse at 50% 0,rgba(255,200,120,.16),transparent 60%),repeating-linear-gradient(90deg,#3A1250 0 38px,#321046 38px 76px);box-shadow:inset 0 0 120px rgba(0,0,0,.65)}
.thr-curt{position:absolute;top:0;bottom:56px;width:clamp(22px,10%,120px);z-index:1;background:repeating-linear-gradient(90deg,#8A1020 0 14px,#B01830 14px 26px,#6E0C19 26px 40px);box-shadow:0 0 36px rgba(0,0,0,.7)}
.thr-curt.l{left:0;border-radius:0 0 40px 0;animation:curtL 1.5s cubic-bezier(.3,.8,.3,1) both}.thr-curt.r{right:0;border-radius:0 0 0 40px;animation:curtR 1.5s cubic-bezier(.3,.8,.3,1) both}
@keyframes curtL{from{width:52%}to{width:clamp(22px,10%,120px)}}@keyframes curtR{from{width:52%}to{width:clamp(22px,10%,120px)}}
.thr-val{position:absolute;left:0;right:0;top:0;height:30px;z-index:3;background:radial-gradient(circle at 50% 0,#B01830 0 16px,transparent 17px) 0 0/34px 30px repeat-x,linear-gradient(#8A1020,#8A1020) 0 0/100% 12px no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.thr-top{position:relative;z-index:2;padding:44px 16px 8px;text-align:center}
.thr-marq{display:inline-block;position:relative;background:#14081F;border:5px solid #FFC34D;border-radius:16px;padding:12px 38px 14px;box-shadow:0 0 34px rgba(255,195,77,.5),0 10px 24px rgba(0,0,0,.5)}
.thr-marq::before,.thr-marq::after{content:"";position:absolute;left:10px;right:10px;height:8px;background:radial-gradient(circle,#FFF4C2 0 3px,transparent 4px) 0 0/18px 8px repeat-x;animation:bulbs 1s steps(2) infinite}.thr-marq::before{top:-4px}.thr-marq::after{bottom:-4px;animation-delay:.5s}
@keyframes bulbs{50%{opacity:.3}}
.thr-marq small{display:block;font-weight:900;letter-spacing:.34em;color:#fff;font-size:11px;text-transform:uppercase}
.thr-marq h2{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,52px);color:#FFC34D;letter-spacing:.05em;line-height:1;text-shadow:0 0 20px rgba(255,195,77,.8)}
.thr-wall{position:relative;z-index:2;padding:26px clamp(34px,12%,150px) 6px}
.tposters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 22px}
.tposter{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;text-decoration:none;transition:transform .25s}
.tposter::before{content:"";position:absolute;left:-18%;right:-18%;top:-30px;height:64px;background:radial-gradient(ellipse at 50% 0,rgba(255,236,170,.4),transparent 70%);pointer-events:none;z-index:3}
.tposter:hover,.tposter:focus-visible{transform:translateY(-8px) rotate(-1deg) scale(1.03)}
.tposter .frame{position:relative;aspect-ratio:2/3;border:6px solid #C9962B;border-radius:6px;background:#14081F;overflow:hidden;box-shadow:0 16px 30px rgba(0,0,0,.6),inset 0 0 0 2px #7A5A12}
.tposter .frame img,.tposter .frame canvas{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover;display:block}
.tposter .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 38%,rgba(10,3,25,.94) 100%)}
.tposter .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 12px;z-index:2}
.tposter .cap b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(17px,4.6vw,22px);line-height:1.05;color:#FFC34D;letter-spacing:.03em;text-shadow:0 2px 6px #000}
.tposter .cap small{display:block;margin-top:3px;font-size:11px;font-weight:800;color:#fff;opacity:.92}
.tposter .play{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(226,69,63,.95);color:#fff;display:grid;place-items:center;font-size:20px;padding-left:3px;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .2s}
.tposter:hover .play{transform:translate(-50%,-50%) scale(1.14)}
.tposter .badge{position:absolute;top:8px;left:8px;z-index:2;background:#8EE65B;color:#12330A;font-weight:900;font-size:10px;padding:3px 9px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase}
.thr-floor{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:4;background:linear-gradient(#7A1226,#3A0710);border-top:5px solid #C9962B;display:flex;justify-content:space-around;align-items:center;font-size:30px;box-shadow:0 -10px 24px rgba(0,0,0,.4)}
.thr-screen{margin:14px 0 10px;border:8px solid #C9962B;border-radius:10px;background:#000;box-shadow:0 0 50px rgba(255,236,170,.25),0 20px 40px rgba(0,0,0,.6)}
.thr-now{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}.thr-now b{font-family:var(--display);font-weight:400;font-size:28px;color:#FFC34D;letter-spacing:.03em}.thr-now small{font-weight:800;color:var(--ink)}
@media (max-width:520px){.tposters{grid-template-columns:repeat(2,1fr);gap:28px 14px}.thr-wall{padding-left:30px;padding-right:30px}}
.prt{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.prt-view{position:sticky;top:0;display:flex;flex-direction:column;gap:8px}
.prt-cv{width:100%!important;height:auto!important;border-radius:22px;border:2px solid var(--line);touch-action:none;cursor:grab;display:block}
.prt-tag{text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
.prt-ctl{display:flex;flex-direction:column;gap:14px}
.prt-sec b{display:block;font-size:15px;color:var(--candle);margin-bottom:6px;font-weight:900}
.prt-row{display:flex;flex-wrap:wrap;gap:8px}
.prt-b{display:flex;flex-direction:column;align-items:center;gap:0;min-width:74px;padding:8px 10px 6px;border-radius:16px;border:3px solid transparent;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.prt-b .e{font-size:30px;line-height:1.1}.prt-b small{font-size:12px;font-weight:800;color:var(--muted)}
.prt-b.on{border-color:var(--slime);background:var(--card-2)}.prt-b.on small{color:var(--ink)}
.prt-c{width:46px;height:46px;border-radius:50%;border:4px solid transparent;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.25)}.prt-c.on{border-color:#fff;box-shadow:0 0 0 3px var(--slime)}
.prt-in{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#120A2E;color:var(--ink);font:800 18px inherit;font-family:inherit}
.prt-act{display:flex;flex-direction:column;gap:10px}.prt-send{font-size:20px;padding:16px}.prt-save{font-size:17px;padding:14px}
.prt-stat{min-height:24px;font-weight:800;font-size:15px;color:var(--candle)}
@media (max-width:820px){.prt{grid-template-columns:1fr}.prt-view{position:static}}
/* play card */
.peek{position:fixed;inset:0;z-index:36;display:grid;place-items:center;padding:14px;background:rgba(5,2,15,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:peekin .2s ease-out}
@keyframes peekin{from{opacity:0}to{opacity:1}}
.peekcard{position:relative;width:min(520px,100%);background:#1A0E3F;border:2px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:peekpop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes peekpop{from{transform:scale(.9) translateY(20px)}to{transform:none}}
.peekcv{width:100%!important;height:auto!important;display:block;background:#241052}
.peekx{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,4,30,.7);color:#fff;font-size:20px;cursor:pointer}
.peekrow{display:flex;gap:14px;align-items:center;padding:14px 18px 6px}
.peekic{font-size:46px;line-height:1}
.peekt{display:flex;flex-direction:column;gap:2px}.peekt b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--pumpkin);letter-spacing:.03em;line-height:1.05}.peekt small{font-size:15px;font-weight:700;color:var(--ink);line-height:1.3}
.peekact{display:flex;gap:12px;padding:10px 18px 20px}
.peekbtn{border:0;border-radius:999px;cursor:pointer;font-weight:900;font-family:inherit;color:#12330A}
.peekbtn.say{flex:none;width:68px;height:68px;font-size:30px;background:#3A2478;color:#fff}
.peekbtn.go{flex:1;height:68px;font-size:26px;background:var(--slime);box-shadow:0 8px 24px rgba(142,230,91,.35);animation:peekpulse 1.6s ease-in-out infinite}
.peekbtn.go.lock{background:#4B3A78;color:#fff;animation:none;box-shadow:none}
@keyframes peekpulse{50%{transform:scale(1.04)}}
/* drawer */
.drawer{position:fixed;inset:0;z-index:35;display:flex}
.drawer .veil{flex:1;background:rgba(5,2,15,.6)}
.drawer .panel{width:min(360px,88vw);background:#0E0726;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.drawer h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 6px;color:var(--pumpkin);letter-spacing:.03em}
.drawer .sec{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--candle);margin-top:12px}
.drawer button.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
.drawer button.item:hover{background:rgba(255,244,230,.08)}
.drawer button.item span.s{font-size:12px;font-weight:800;color:var(--muted)}
.drawer button.item.locked{color:var(--muted)}

/* boot */
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 70%,#3A1A6E 0%,#160B33 55%,#0B0520 100%);text-align:center;padding:24px}
.boot .wm{width:min(560px,84vw)}
.boot p{margin:0;font-weight:700;color:var(--muted);max-width:44ch;text-wrap:balance}
.playbtn{width:150px;height:150px;border-radius:50%;border:0;background:#E2453F;color:#fff;font-family:var(--display);font-size:40px;letter-spacing:.04em;cursor:pointer;box-shadow:0 14px 0 #8E1F33,0 24px 50px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s}
.playbtn:hover{transform:translateY(-4px);box-shadow:0 18px 0 #8E1F33,0 30px 60px rgba(0,0,0,.5)}
.playbtn:active{transform:translateY(8px);box-shadow:0 6px 0 #8E1F33}
.boot .small{font-size:13px;color:var(--muted)}
@keyframes bootfade{to{opacity:0;visibility:hidden}}
.boot.out{animation:bootfade .6s ease forwards}

/* buttons */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;background:var(--pumpkin);color:#2A0F3A;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(255,122,26,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,244,230,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.slime{background:var(--slime);color:#163A08;box-shadow:0 8px 24px rgba(142,230,91,.3)}

/* modal + scenes */
.modal{position:fixed;inset:0;z-index:45;background:#0B0520;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.modal-bar{display:flex;align-items:center;gap:12px;height:58px;flex:none;border-bottom:1px solid var(--line);background:#120A2E}
.modal-bar .title{font-family:var(--display);font-size:26px;letter-spacing:.03em;color:var(--pumpkin);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,244,230,.06);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:rgba(255,244,230,.14)}
.stage{flex:1;min-height:0;position:relative;overflow:auto}
.gwrap{position:relative;width:100%;height:100%;min-height:360px;background:#0B0520;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gcanvas{display:block}
.hud{position:absolute;top:12px;left:16px;display:flex;gap:16px;font-weight:800;font-size:16px;text-shadow:0 2px 8px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);text-shadow:0 2px 8px #000;pointer-events:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,5,32,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3}
.pop{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 26px 26px;max-width:440px;width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px}
.pop h2{font-family:var(--display);font-weight:400;font-size:40px;margin:0;color:var(--pumpkin);letter-spacing:.03em;line-height:1}
.pop p{margin:0 0 8px;color:var(--muted);font-weight:700}
.pop .score{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.pop .host{width:120px;height:135px}
.pop .stars{display:flex;gap:6px}
.pop .stars svg{width:36px;height:36px}
.pop .tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--candle)}

.scene{padding:20px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.scene h3{margin:0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-weight:800;font-size:13px}
.ctl .lbl{min-width:84px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.ctl .val{min-width:92px;text-align:center}
.ctl button{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,244,230,.1);color:var(--ink);font-weight:800;cursor:pointer}
.swatch{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:#fff}
.tool{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer}
.tool.on{background:var(--pumpkin);color:#2A0F3A;border-color:transparent}
input[type=range]{accent-color:var(--pumpkin)}
label.chk{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px}


/* sound style popover + sound board */
.sndpop{position:fixed;z-index:60;top:76px;left:12px;width:min(300px,calc(100vw - 24px));background:#120A2E;border:2px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.sndpop[hidden]{display:none}
.sndpop h4{margin:2px 4px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sndpop .opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:800;font-size:15px}
.sndpop .opt .e{font-size:28px;line-height:1}
.sndpop .opt small{display:block;font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.02em}
.sndpop .opt.on{border-color:var(--slime);background:var(--card-2)}
.sndpop .go{width:100%;margin-top:2px;background:var(--pumpkin);color:#2A1008;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.sb{padding:14px 14px 22px;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#3A1A6E 0%,#160B33 55%,#0B0520 100%);position:relative;overflow:hidden}
.sb h3{font-family:'Creepster',cursive;letter-spacing:.06em;color:var(--pumpkin);font-size:26px;text-align:center;margin:2px 0 2px;font-weight:400}
.sb .sub{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:12px}
.sb-mode{display:flex;justify-content:center;gap:6px;margin:0 auto 14px;background:#120A2E;border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.sb-mode button{border:0;background:transparent;color:var(--ink);font-weight:800;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer}
.sb-mode button.on{background:var(--pumpkin);color:#2A1008}
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;max-width:760px;margin:0 auto}
.sb-tile{position:relative;aspect-ratio:1/1;border-radius:24px;border:2px solid rgba(255,244,230,.14);background:linear-gradient(160deg,var(--c1,#4A2A8A),var(--c2,#241250));color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px 6px 6px;overflow:hidden;transition:transform .12s}
.sb-tile:active{transform:scale(.94)}
.sb-tile .em{font-size:clamp(38px,11vw,54px);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));animation:sbfloat 3.2s ease-in-out infinite}
.sb-tile:nth-child(2n) .em{animation-delay:-1s}.sb-tile:nth-child(3n) .em{animation-delay:-2s}
@keyframes sbfloat{50%{transform:translateY(-5px) rotate(-3deg)}}
.sb-tile .lb{font-size:12px;font-weight:800;letter-spacing:.04em;text-align:center;line-height:1.1}
.sb-tile .rg{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0}
.sb-tile.hit{animation:sbhit .5s ease-out}
.sb-tile.hit .rg{animation:sbring .6s ease-out}
@keyframes sbhit{30%{transform:scale(1.08) rotate(-2deg)}60%{transform:scale(.97) rotate(1.5deg)}}
@keyframes sbring{0%{opacity:.9;box-shadow:inset 0 0 0 0 rgba(255,244,230,.8)}100%{opacity:0;box-shadow:inset 0 0 0 40px rgba(255,244,230,0)}}
.sb-auto{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,244,230,.5);background:rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font-size:12px}
.sb-auto.on{background:var(--slime);border-color:var(--slime);color:#143008}
.sb-tag{position:absolute;left:8px;top:8px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.4);border-radius:8px;padding:2px 6px}
.sb-leg{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin-top:14px}
.sb-cv{display:block;margin:0 auto 12px;border-radius:22px;border:2px solid rgba(255,244,230,.14)}
.sb-eq{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:34px;margin:0 auto 10px}
.sb-eq i{width:6px;border-radius:3px;background:linear-gradient(var(--pumpkin),#B26BFF);height:6px}
.jam-slot:not(.on)::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;color:rgba(255,244,230,.28);animation:jplus 1.8s ease-in-out infinite}
@keyframes jplus{50%{transform:scale(1.25);color:rgba(255,194,77,.6)}}
.jam-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* music hall */
.hall{display:flex;flex-direction:column;height:100%;min-height:520px}
.hall-tabs{display:flex;gap:8px;padding:10px 12px;background:#0F0826;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.hall-tab{flex:none;display:flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--card);color:var(--ink);font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer}
.hall-tab .e{font-size:20px;line-height:1}
.hall-tab.on{background:var(--pumpkin);color:#2A1008}
.hall-body{flex:1;min-height:0;position:relative;overflow:auto}
.hall-body>.jam{height:100%}
.mix{max-width:560px;margin:0 auto;padding:14px 14px 26px}
.mixrow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-weight:800;font-size:15px}
.mixrow small{display:block;font-weight:700;font-size:11px;color:var(--muted)}
.mixrow .s{margin-left:auto;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mixrow.on .s{color:var(--slime)}
.mixrow.on{border-color:rgba(142,242,106,.45)}
/* music hall: one page */
.jam-main{flex:1;display:flex;min-height:340px}
.jam-main .jam-stage{min-width:0;flex:1}
.rail{flex:none;width:350px;display:flex;flex-direction:column;gap:8px;padding:8px;background:#120A2E;border-left:1px solid var(--line);overflow:auto}
.rail-seg{width:100%;margin:0;display:flex;flex:none}
.rail-seg button{flex:1;padding:8px 4px;font-size:12px}
.rail-mid{flex:1;min-height:0;display:flex;gap:8px}
.rail-left{width:182px;flex:none;display:flex;flex-direction:column;gap:8px}
.rail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rt{position:relative;aspect-ratio:1/1;border-radius:14px;border:2px solid rgba(255,244,230,.14);background:linear-gradient(160deg,var(--c1,#4A2A8A),var(--c2,#241250));color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0 0;overflow:hidden;transition:transform .12s}
.rt:active{transform:scale(.93)}
.rt .em{font-size:24px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.rt .lb{font-size:9px;font-weight:800;letter-spacing:.02em;line-height:1}
.rt.hit{animation:sbhit .45s ease-out}
.rt.armed{border-color:var(--slime);box-shadow:0 0 0 3px rgba(142,242,106,.35),0 0 18px rgba(142,242,106,.35)}
.rt .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,244,230,.5);background:rgba(0,0,0,.4);display:grid;place-items:center;font-size:6px;color:#fff;padding:0;cursor:pointer}
.rt .dot.on{background:var(--slime);border-color:var(--slime);color:#143008}
.rt .co{position:absolute;left:3px;top:2px;font-size:8px;opacity:.8}
.rail-org{width:100%;height:auto;border-radius:14px;background:radial-gradient(ellipse at 50% 90%,#4A2290,#160B33 75%);border:2px solid rgba(255,244,230,.12);margin-top:auto}
.rail-master{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:8px 10px;font-weight:800;font-size:11px;cursor:pointer}
.rail-master.on{border-color:rgba(142,242,106,.5)}
.rail-master .s{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail-master.on .s{color:var(--slime)}
.stf{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 6px;background:linear-gradient(90deg,#F8EEDA,#EBDDBB);border:3px solid #5A3A1A;border-radius:14px;color:#3A2410}
.stf-clef{flex:none;text-align:center;font-size:24px;line-height:1}
.stf-sheet{flex:1;position:relative;min-height:330px;display:grid;grid-template-rows:repeat(16,1fr);min-width:0;
 background:linear-gradient(#6A4A2A,#6A4A2A) 18% 0/2px 100% no-repeat,linear-gradient(#6A4A2A,#6A4A2A) 34% 0/2px 100% no-repeat,linear-gradient(#6A4A2A,#6A4A2A) 50% 0/2px 100% no-repeat,linear-gradient(#6A4A2A,#6A4A2A) 66% 0/2px 100% no-repeat,linear-gradient(#6A4A2A,#6A4A2A) 82% 0/2px 100% no-repeat}
.stf-sheet::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:5px;border-top:2px solid #4A2E14;border-bottom:4px solid #4A2E14;pointer-events:none}
.stf-col{position:relative;background:transparent;border:0;cursor:pointer;padding:0;border-radius:6px}
.stf-col.bar{border-bottom:2px solid rgba(74,46,20,.55)}
.stf-col:hover{background:rgba(255,122,26,.12)}
.stf.armed .stf-col:not(.has){animation:stfpulse 1.4s ease-in-out infinite}
@keyframes stfpulse{50%{background:rgba(142,242,106,.28)}}
.stf-note{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#2A1858;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.stf-note.ping{animation:notepop .35s ease-out}
@keyframes notepop{40%{transform:translate(-50%,-50%) scale(1.4)}}
.stf-head{position:absolute;left:0;right:0;height:4px;margin-top:-2px;border-radius:2px;background:#E8650A;box-shadow:0 0 10px #FF7A1A;top:0;transition:top .09s linear;opacity:0;pointer-events:none}
.stf-hint{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:12px;color:rgba(58,36,16,.65);pointer-events:none;text-align:center;padding:0 10px;line-height:1.3}
.stf-ctl{flex:none;display:flex;gap:6px;justify-content:center}
.stf-btn{width:42px;height:42px;border-radius:50%;border:0;background:#E8650A;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.stf-btn.g{background:#5A3A1A;font-size:16px;border-radius:14px}
.jam-top{pointer-events:none}.jam-top>*{pointer-events:auto}
.host-btn{position:relative;flex:none;background:none;border:0;padding:0;cursor:pointer}
.host-btn .q{position:absolute;right:-2px;top:4px;width:22px;height:22px;border-radius:50%;background:#FFC34D;color:#2A1858;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.jam-top .jam-bubble{flex:0 1 440px}
.jam-top.min .jam-bubble{background:none;box-shadow:none;padding:0;align-self:center}
.jam-top.min .jam-bubble::before,.jam-top.min .jt,.jam-top.min .js{display:none}
.jam-top.min .host-btn .q{background:#8EF26A}
@media (max-width:760px){.jam{overflow-y:auto}.jam-main{flex:none!important}.jam-main .jam-stage{flex:none!important;height:300px}.rail{overflow:visible}.jam-top .jt{font-size:12px!important}.jam-bubble .js{display:none}.jam-main{flex-direction:column;min-height:0}.jam-main .jam-stage{min-height:260px}.rail{width:auto;border-left:0;border-top:1px solid var(--line)}.rail-mid{flex-direction:column}.rail-left{width:auto}.rail-grid{grid-template-columns:repeat(6,1fr)}.rt .em{font-size:24px}.rt .lb{display:none}.rail-org{display:none}.stf-sheet{min-height:300px}}
/* jamband */
.jam{display:flex;flex-direction:column;height:100%;min-height:520px}
.jam-stage{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,22px);padding:30px 16px 24px;background:radial-gradient(ellipse at 50% 100%,#3A1A6E 0%,#160B33 60%,#0B0520 100%);overflow:hidden}
.jam-stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:#1B0F3A;border-top:4px solid #2A1858}
.jam-slot{position:relative;width:clamp(78px,14vw,130px);height:clamp(120px,22vw,180px);display:grid;place-items:end center;border-radius:60px 60px 10px 10px;border:2px dashed rgba(255,244,230,.18);transition:border-color .2s;z-index:1}
.jam-slot.on{border-color:transparent;background:radial-gradient(ellipse at 50% 0%,rgba(255,227,150,.28),rgba(255,227,150,0) 70%)}
.jam-slot canvas{position:relative;transform-origin:50% 100%}
.jam-slot.hit canvas{animation:bump .22s ease-out}
@keyframes bump{30%{transform:scale(1.12,.9) translateY(4px)}70%{transform:scale(.95,1.1) translateY(-10px)}}
.jam-slot .nm{position:absolute;top:-22px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--candle);white-space:nowrap}
.jam-roster{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;background:#120A2E;border-top:1px solid var(--line);align-items:center}
.jam-member{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:8px 10px 6px;cursor:pointer;color:var(--ink);min-width:92px}
.jam-member.on{border-color:var(--slime);background:var(--card-2)}
.jam-member b{font-size:13px}
.jam-member small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jam-tempo{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jam-top{position:absolute;top:10px;left:12px;right:12px;z-index:2;display:flex;gap:10px;align-items:flex-start}
.jam-top .host{flex:none;margin-top:6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.jam-bubble{position:relative;flex:1;min-width:0;background:#FFF4E6;color:#2A1858;border-radius:20px;padding:10px 14px 12px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.jam-bubble::before{content:"";position:absolute;left:-9px;top:28px;border:10px solid transparent;border-right-color:#FFF4E6;border-left:0}
.jam-bubble.bp{animation:bubIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes bubIn{from{transform:scale(.92) translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.jam-bubble .js{font-family:'Creepster',cursive;letter-spacing:.06em;color:#E8650A;font-size:15px;margin-bottom:2px}
.jam-bubble .jt{font-weight:700;font-size:clamp(13px,3.5vw,16px);line-height:1.35}
.jam-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.jam-actions[hidden]{display:none}
@media (max-width:520px){.jam-top .host{width:64px!important;height:72px!important}.jam-bubble{padding:9px 11px 11px}}

/* maker + carver */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.preview{background:radial-gradient(ellipse at 50% 70%,#3A1A6E,#160B33 70%);border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;padding:16px;min-height:340px}
.preview svg{max-width:100%;height:auto;max-height:70vh;touch-action:none}
.controls{display:flex;flex-direction:column;gap:10px}
.mname{font-family:var(--display);font-size:34px;color:var(--pumpkin);letter-spacing:.03em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cutgrp.lit{filter:url(#cutglow);animation:flick 1.1s infinite alternate}
@keyframes flick{0%{opacity:1}35%{opacity:.86}60%{opacity:1}100%{opacity:.78}}

/* spell */
.lab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:22px;align-items:start}
@media (max-width:800px){.lab{grid-template-columns:1fr}}
.board{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#160B33;aspect-ratio:7/5;max-width:100%}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}
.cmd{width:34px;height:34px;border-radius:9px;border:0;background:var(--violet);color:#fff;font-size:18px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.cmd.run{background:var(--card-2);border:1px solid var(--line)}
.cmd.bad{background:#E2453F}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center}
.pad .cmd{width:44px;height:44px}
.msg{min-height:24px;font-weight:800;color:var(--candle)}

/* match */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto;width:100%}
.mcard{aspect-ratio:1;perspective:600px;cursor:pointer;background:none;border:0;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.mcard .back{background:linear-gradient(135deg,#4B2A8C,#2E1B60);font-family:var(--display);font-size:34px;color:var(--candle)}
.mcard .front{background:var(--card);transform:rotateY(180deg)}
.mcard.done .front{background:#1F3B2A;border-color:var(--slime)}
.mcard canvas{width:70%;height:70%}

/* shorts */
.short{display:flex;flex-direction:column;height:100%;min-height:480px}
.short-view{flex:1;min-height:0;position:relative}
.short-bar{flex:none;padding:12px 16px;background:#120A2E;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.caption{font-size:clamp(15px,2.2vw,20px);font-weight:700;min-height:1.5em;text-wrap:balance}
.short-ctl{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:rgba(255,244,230,.14);overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--pumpkin)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.poster{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;padding:0;color:inherit;text-align:left;display:flex;flex-direction:column;transition:transform .2s}
.poster:hover{transform:translateY(-6px) rotate(-.6deg)}
.poster canvas{width:100%;height:auto;display:block}
.vthumb{position:relative;aspect-ratio:16/9;background:#1B0D3A;overflow:hidden}.vthumb img,.vthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(226,69,63,.94);color:#fff;display:grid;place-items:center;font-size:22px;padding-left:4px;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .2s}
.poster:hover .vplay{transform:translate(-50%,-50%) scale(1.12)}
.vbox{aspect-ratio:16/9;background:#000}.vbox iframe{width:100%;height:100%;border:0;display:block}
.poster.playing{grid-column:1/-1;cursor:default}.poster.playing:hover{transform:none}
.poster .meta{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.poster h3{margin:0;font-size:20px}
.poster p{margin:0;color:var(--muted);font-size:14px}

/* cast + world */
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.castbtn{background:var(--card-2);border:2px solid transparent;border-radius:22px;padding:10px 8px 12px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s}
.castbtn:hover{transform:translateY(-4px)}
.castbtn.on{border-color:var(--candle);background:#4A2F86}
.castbtn canvas{width:104px;height:117px}
.castbtn b{font-size:15px}.castbtn small{font-size:12px;color:var(--muted)}
.castinfo{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.castinfo h3{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1;color:var(--pumpkin);letter-spacing:.03em}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.kv span:first-child{color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.stamp{position:relative;background:#F3E6CC;color:#2A1548;border:7px dotted #140B2E;border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.stamp .band{height:10px;border-radius:3px}
.stamp .place{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B3A2A;padding-right:64px}
.stamp h4{margin:0;font-size:20px}
.stamp p{margin:0;font-size:15px;color:#4A3A62}
.stamp .mark{position:absolute;top:26px;right:12px;width:58px;height:58px;border-radius:50%;border:2px solid rgba(42,21,72,.4);display:grid;place-items:center;transform:rotate(-14deg);font-size:11px;font-weight:800;letter-spacing:.08em;color:rgba(42,21,72,.55);text-align:center;line-height:1.1}

/* tracker */
.trk{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:520px}
@media (max-width:860px){.trk{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto}}
.trk-map{position:relative;overflow:hidden;background:#0E0A2A}
.trk-map canvas{position:absolute;inset:0;width:100%;height:100%}
.trk-panel{background:#120A2E;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-width:0}
.trk-panel .status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trk-panel .status i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.trk-panel .status.live i{background:var(--slime);box-shadow:0 0 10px var(--slime);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.trk-panel .big{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--pumpkin);letter-spacing:.03em}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b.c{color:var(--candle)}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.postcard{background:#F3E6CC;color:#2A1548;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:rotate(-1.2deg);box-shadow:0 8px 0 rgba(0,0,0,.3)}
.postcard canvas{width:70px;height:78px;flex:none}
.postcard b{display:block;font-size:16px}
.postcard p{margin:0;font-size:13px;line-height:1.3;color:#4A3A62}
.checklist{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.checklist div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.checklist div.ok{color:var(--ink)}
.checklist i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.checklist div.ok i{background:var(--slime);border-color:var(--slime);color:#163A08}
.stops{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:14px}
.stops li{display:flex;justify-content:space-between;gap:10px;padding:4px 8px;border-radius:8px;color:var(--muted)}
.stops li.done{color:var(--ink)}
.stops li.now{background:rgba(142,230,91,.14);color:var(--ink)}
.stops li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}

footer{position:relative;z-index:2;padding-block:28px 40px;color:var(--muted);font-size:13px;text-align:center;background:#0B0520;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.hot .sign,.btn{transition:none}.jam-slot.hit canvas{animation:none}.ghostbtn svg{animation:none}}
</style>

 tone(f,dur,type='sine',vol=.15,when=null,slide=null,dest=null){const c=this.get();if(!c||(this.muted&&!dest))return;const t=when==null?c.currentTime:when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||c.destination);o.start(t);o.stop(t+dur+.05);},

  for(let k=0;k<P.n;k++){const nx=P.nor[k*3],ny=P.nor[k*3+1],nz=P.nor[k*3+2],rny=nx*sa+ny*ca;if(-rny*cp+nz*sp<-.02)continue;const cx=P.cen[k*3],cy=P.cen[k*3+1],cz=P.cen[k*3+2];dep[k]=(cx*sa+cy*ca)*cp-cz*sp;idx.push(k);}
  idx.sort((a,b)=>dep[b]-dep[a]);
  for(const k of idx){const b=k*9,a1=proj(tris[b],tris[b+1],tris[b+2]),a2=proj(tris[b+3],tris[b+4],tris[b+5]),a3=proj(tris[b+6],tris[b+7],tris[b+8]);
   const nx=P.nor[k*3],ny=P.nor[k*3+1],nz=P.nor[k*3+2],rx=nx*ca-ny*sa,ry=nx*sa+ny*ca,sh=.2+.8*Math.max(0,rx*-.5+ry*-.55+nz*.7);
   c.fillStyle='rgb('+(r*sh|0)+','+(gg*sh|0)+','+(bb*sh|0)+')';c.strokeStyle=c.fillStyle;c.lineWidth=.6;c.beginPath();c.moveTo(a1[0],a1[1]);c.lineTo(a2[0],a2[1]);c.lineTo(a3[0],a3[1]);c.closePath();c.fill();c.stroke();}}
 const t0=performance.now();let last=t0;function loop(){if(!alive)return;const now=performance.now();if(!drag)ang+=(now-last)/1000*.7;last=now;draw((now-t0)/1000);raf=requestAnimationFrame(loop);}

 const fname=()=>('halloween-'+o.shape+'-'+(o.nick||'print')).replace(/[^\w\-]+/g,'-').toLowerCase()+'.stl';

/* ---------- Music Hall extras: sound rail, sheet-music paper, organist in the background ---------- */
const HALL_SOUNDS=[['crows','🐦‍⬛','Crow',3,'#4A3A7A','#1E1240'],['owl','🦉','Owl',2,'#6A4A2A','#2A1A10'],['wolf','🐺','Wolf',5,'#3A4A8A','#141A3A'],['bell','🔔','Bell',4,'#8A6A1A','#3A2A08'],
 ['creak','🚪','Door',1,'#6A3A2A','#2A1410'],['chains','⛓️','Chains',0,'#4A5A6A','#1A222A'],['thunder','⛈️','Thunder',6,'#3A3A9A','#12123A'],['cackle','🧙','Witch',7,'#4A8A3A','#14300E'],
 ['organ','🎹','Organ',8,'#7A3A8A','#2A1240'],['ghosts','👻','Ghost',3,'#5A6A9A','#1C2240',1],['musicbox','🎵','Music box',6,'#9A4A7A','#3A1230',1],['horse','🐴','Horse',1,'#6A4A4A','#2A1A1A',1]];
function drawOrganLocal(x,t,hands,lvl){const W=640,H=250;x.clearRect(0,0,W,H);
 const n=13;for(let i=0;i<n;i++){const c=Math.abs(i-(n-1)/2),ph=H*.74-(8+(n/2-c)*13+(i%2)*10)*2.1,px=W*.5+(i-(n-1)/2)*38,pw=28;const glow=Math.max(0,lvl*(.5+.5*Math.sin(t*9+i*1.3)));
  const pg=x.createLinearGradient(px-pw/2,0,px+pw/2,0);pg.addColorStop(0,'#6A5A8A');pg.addColorStop(.45,'#D8CCF0');pg.addColorStop(1,'#4A3A6A');x.fillStyle=pg;x.fillRect(px-pw/2,Math.max(0,ph),pw,H*.74-Math.max(0,ph));
  x.fillStyle='#2A1A48';x.fillRect(px-pw/2+4,H*.74-34,pw-8,12);x.fillStyle='rgba(255,200,80,'+(.15+glow*.8)+')';x.fillRect(px-pw/2+4,H*.74-34,pw-8,12);
  if(glow>.02){const rg=x.createRadialGradient(px,H*.74-28,2,px,H*.74-28,46);rg.addColorStop(0,'rgba(255,200,80,'+glow*.45+')');rg.addColorStop(1,'rgba(255,200,80,0)');x.fillStyle=rg;x.fillRect(px-50,H*.74-80,100,100);}}
 [W*.08,W*.92].forEach((cx,i)=>{x.fillStyle='#EADFC8';x.fillRect(cx-7,H*.5,14,H*.25);const fl=1+Math.sin(t*11+i*2)*.12;x.fillStyle='#FFB830';x.beginPath();x.ellipse(cx,H*.46,6*fl,11*fl,0,0,6.283);x.fill();const rg=x.createRadialGradient(cx,H*.46,2,cx,H*.46,70);rg.addColorStop(0,'rgba(255,190,80,.35)');rg.addColorStop(1,'rgba(255,190,80,0)');x.fillStyle=rg;x.fillRect(cx-70,H*.46-70,140,140);});
 x.fillStyle='#3A1E10';x.fillRect(W*.2,H*.74,W*.6,H*.26);x.fillStyle='#5A3018';x.fillRect(W*.2,H*.74,W*.6,8);
 for(let i=0;i<24;i++){const kx=W*.23+i*(W*.54/24),dn=(hands>.05&&Math.sin(t*14+i*1.7)>.45)?3:0;x.fillStyle='#F4EEDD';x.fillRect(kx,H*.78+dn,W*.54/24-2,H*.14);}
 const bob=Math.sin(t*(2+hands*6))*(2+hands*5),sx=W*.5,sy=H*.55+bob;
 x.fillStyle='#10081F';x.beginPath();x.moveTo(sx-34,sy+10);x.lineTo(sx-46,H*.74);x.lineTo(sx+46,H*.74);x.lineTo(sx+34,sy+10);x.closePath();x.fill();
 x.strokeStyle='#F4F0FF';x.lineWidth=4;x.lineCap='round';for(let r=0;r<4;r++){x.beginPath();x.moveTo(sx-16-r*2,sy+16+r*10);x.quadraticCurveTo(sx,sy+22+r*10,sx+16+r*2,sy+16+r*10);x.stroke();}x.beginPath();x.moveTo(sx,sy+12);x.lineTo(sx,sy+50);x.stroke();
 const arm=d=>{const a=Math.sin(t*14+d*2)*hands*10,hx=sx+d*(34+Math.sin(t*9+d)*hands*14),hy=H*.78+a;x.beginPath();x.moveTo(sx+d*20,sy+18);x.lineTo(sx+d*44,sy+44);x.lineTo(hx,hy);x.stroke();x.fillStyle='#F4F0FF';x.beginPath();x.arc(hx,hy,5,0,6.283);x.fill();};arm(-1);arm(1);
 x.fillStyle='#F4F0FF';x.beginPath();x.ellipse(sx,sy-14,22,24,0,0,6.283);x.fill();x.fillStyle='#1A0F33';x.beginPath();x.ellipse(sx-8,sy-16,6,7,0,0,6.283);x.ellipse(sx+8,sy-16,6,7,0,0,6.283);x.fill();x.beginPath();x.moveTo(sx,sy-10);x.lineTo(sx-3,sy-3);x.lineTo(sx+3,sy-3);x.fill();
 x.strokeStyle='#1A0F33';x.lineWidth=2;x.beginPath();x.moveTo(sx-10,sy+1);x.lineTo(sx+10,sy+1);for(let k=-8;k<=8;k+=4){x.moveTo(sx+k,sy-2);x.lineTo(sx+k,sy+4);}x.stroke();
 x.fillStyle='#1A0F33';x.fillRect(sx-24,sy-44,48,6);x.fillRect(sx-15,sy-72,30,30);x.fillStyle='#FF7A1A';x.fillRect(sx-15,sy-48,30,6);}

function hallExtras(){
 const N=16,info=Object.fromEntries(HALL_SOUNDS.map(s=>[s[0],s]));
 let seq=(store.get('hv-staff',[])||[]).slice(0,N);while(seq.length<N)seq.push(null);seq=seq.map(v=>v&&info[v]?v:null);
 let armed=null,playing=false,pos=0,next=0,hands=0,lvl=0,alive=true;
 /* ----- rail: pictures to tap ----- */
 const M=[['real','🎙️ Real'],['synth','🎛️ Computer']];const seg=el('div',{class:'sb-mode rail-seg',role:'group','aria-label':'Sound style'});
 const paintM=()=>seg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',M[i][0]===SMP.mode));
 M.forEach(([k,l])=>{const b=el('button',{type:'button'},l);b.onclick=()=>{SMP.setMode(k);paintM();SFX.get();SFX.click();};seg.append(b);});
 const grid=el('div',{class:'rail-grid'}),tiles={},dots=[];
 HALL_SOUNDS.forEach(([id,em,lb,row,c1,c2,only])=>{
  const t=el('button',{class:'rt',type:'button','aria-label':lb,style:'--c1:'+c1+';--c2:'+c2},el('span',{class:'em'},em),el('span',{class:'lb'},lb));
  if(only)t.append(el('span',{class:'co',title:'Computer sound'},'🎛️'));
  const d=el('span',{class:'dot',role:'switch','aria-label':lb+' plays by itself in the village'},'●');const pd=()=>d.classList.toggle('on',!!AMB.on[id]);pd();dots.push(pd);
  d.onclick=e=>{e.stopPropagation();AMB.set(id,!AMB.on[id]);dots.forEach(f=>f());paintMaster();SFX.click();};t.append(d);
  t.onclick=()=>{t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');arm(id);fire(id);};tiles[id]=t;grid.append(t);});
 const master=el('button',{class:'rail-master',type:'button'},el('span',{},'🌙 Village sounds'),el('span',{class:'s'},''));
 const paintMaster=()=>{const on=AMB.anyOn();master.classList.toggle('on',on);master.querySelector('.s').textContent=on?'On':'Off';};
 master.onclick=()=>{if(AMB.anyOn())AMB.allOff();else AMB.allOn();dots.forEach(f=>f());paintMaster();SFX.click();};
 const orgCv=document.createElement('canvas');orgCv.width=640;orgCv.height=250;orgCv.className='rail-org';const ox=orgCv.getContext('2d');
 const sheet=el('div',{class:'stf-sheet'}),cols=[];
 for(let i=0;i<N;i++){const c=el('button',{class:'stf-col'+(i===7?' bar':''),type:'button','aria-label':'Music paper spot '+(i+1)});c.onclick=()=>tap(i);sheet.append(c);cols.push(c);}
 const head=el('div',{class:'stf-head'}),hint=el('div',{class:'stf-hint'},'👈 Tap a picture, then tap here');sheet.append(head,hint);
 const playB=el('button',{class:'stf-btn',type:'button','aria-label':'Play the music paper'},'▶'),clrB=el('button',{class:'stf-btn g',type:'button','aria-label':'Clear the music paper'},'🗑');
 const staff=el('div',{class:'stf'},el('div',{class:'stf-clef'},'🎼'),sheet,el('div',{class:'stf-ctl'},playB,clrB));
 const rail=el('div',{class:'rail'},seg,el('div',{class:'rail-mid'},el('div',{class:'rail-left'},grid,orgCv,master),staff));
 function paintSeq(){cols.forEach((c,i)=>{c.innerHTML='';c.classList.toggle('has',!!seq[i]);if(seq[i]){const s=info[seq[i]];c.append(el('span',{class:'stf-note',style:'left:'+(9+s[3]*10.2)+'%'},s[1]));}});hint.hidden=seq.some(Boolean);}
 function save(){store.set('hv-staff',seq);}
 function arm(id){armed=id;Object.entries(tiles).forEach(([k,t])=>t.classList.toggle('armed',k===id));staff.classList.toggle('armed',!!id);hint.textContent=id?'👉 Now tap the paper':'👈 Tap a picture, then tap here';}
 function fire(id){lvl=1;hands=1;AMB.fire(id);}
 function tap(i){
  if(!seq[i]){if(!armed){grid.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:260});SFX.thud();return;}seq[i]=armed;fire(armed);}
  else if(armed&&seq[i]!==armed){seq[i]=armed;fire(armed);}
  else{seq[i]=null;SFX.click();}
  save();paintSeq();if(seq.some(Boolean)&&!playing)start();}
 function stepMs(){return 60/Math.max(60,BAND.bpm)/2*1000;}
 function start(){playing=true;pos=0;next=performance.now()+40;playB.textContent='⏸';head.style.opacity=1;}
 function stop(){playing=false;playB.textContent='▶';head.style.opacity=0;}
 playB.onclick=()=>{SFX.get();SFX.click();if(playing)stop();else{if(!seq.some(Boolean)){toast('Put a picture on the paper first.');return;}start();}};
 clrB.onclick=()=>{seq=seq.map(()=>null);save();paintSeq();stop();SFX.click();};
 const timer=setInterval(()=>{if(!alive||!playing)return;const now=performance.now();if(now<next)return;
  head.style.top=((pos+.5)/N*100)+'%';const id=seq[pos];if(id){fire(id);const n=cols[pos].querySelector('.stf-note');if(n){n.classList.remove('ping');void n.offsetWidth;n.classList.add('ping');}}
  pos=(pos+1)%N;next+=stepMs();if(now>next+400)next=now+stepMs();},25);
 paintSeq();paintM();paintMaster();
 /* ----- the organist: a small prop in the rail ----- */
 function drawBg(x,w,h,t,dt){lvl*=.95;hands*=.97;drawOrganLocal(ox,t,hands,lvl);}
 return{rail,drawBg,hit(){hands=Math.max(hands,.4);},destroy(){alive=false;clearInterval(timer);}};}
